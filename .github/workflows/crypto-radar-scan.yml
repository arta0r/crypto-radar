# اجرای رایگان دوره‌ای با GitHub Actions
name: crypto-radar-scan

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore previous state
        run: |
          mkdir -p data state
          if [ -f state/bot.db ]; then cp state/bot.db data/bot.db; fi

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scan + track + notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TRACK_COINS: ${{ secrets.TRACK_COINS }}
        run: python main.py --once

      - name: Save state back to repo
        run: |
          cp -f data/bot.db state/bot.db 2>/dev/null || true
          git config user.name "crypto-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/bot.db
          git diff --cached --quiet && echo "بدون تغییر" || { git commit -m "chore: update radar state [skip ci]"; git push; }
